name: Temporary Schedule Trigger Check

on:
  schedule:
    - cron: '*/5 5 14 11 *'
  push:
    paths:
      - '.github/workflows/schedule-check.yml'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm trigger and UTC time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          printf 'Trigger event: %s\n' "$TRIGGER_EVENT"
          date -u '+UTC time: %Y-%m-%d %H:%M:%S'
